name: Build

on: push

jobs:
  ubuntu-22-04:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Build Soup
        run: php Sun/vendor/Soup/build_lib.php

      - name: Build Sun
        run: clang -O3 -o suncli Sun/sun.cpp -ISun/vendor/Soup Sun/vendor/Soup/libsoup.a -std=c++17 -fuse-ld=lld -lstdc++ -lstdc++fs -pthreads

      - name: Upload Sun
        uses: actions/upload-artifact@v7
        with:
          name: "Linux (X64)"
          path: suncli

      - run: php test.php

  ubuntu-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build Soup
        run: php Sun/vendor/Soup/build_lib.php

      - name: Build Sun
        run: clang -O3 -o suncli Sun/sun.cpp -ISun/vendor/Soup Sun/vendor/Soup/libsoup.a -std=c++17 -fuse-ld=lld -lstdc++ -lstdc++fs -pthreads

      - name: Upload Sun
        uses: actions/upload-artifact@v7
        with:
          name: "Linux (ARM64)"
          path: suncli

      - run: php test.php

  macos-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - name: Build Soup
        run: php Sun/vendor/Soup/build_lib.php

      - name: Build Sun
        run: clang -O3 -o suncli Sun/sun.cpp -ISun/vendor/Soup Sun/vendor/Soup/libsoup.a -std=c++17 -lc++

      - name: Upload Sun
        uses: actions/upload-artifact@v7
        with:
          name: "MacOS (X64)"
          path: suncli

      - run: php test.php

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Build Soup
        run: php Sun/vendor/Soup/build_lib.php

      - name: Build Sun
        run: clang -O3 -o suncli Sun/sun.cpp -ISun/vendor/Soup Sun/vendor/Soup/libsoup.a -std=c++17 -lc++

      - name: Upload Sun
        uses: actions/upload-artifact@v7
        with:
          name: "MacOS (ARM64)"
          path: suncli

      - run: php test.php

  windows-latest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Soup
        run: php Sun/vendor/Soup/build_lib.php

      - name: Build Sun
        run: clang -O3 -o Sun.exe Sun/sun.cpp -ISun/vendor/Soup Sun/vendor/Soup/soup.lib -std=c++17

      - name: Upload Sun
        uses: actions/upload-artifact@v7
        with:
          name: "Windows (X64)"
          path: Sun.exe

      - run: php test.php

      - run: echo '{"path":["Sun.exe"]}' > .chocogen.json
      - run: curl https://raw.githubusercontent.com/calamity-inc/chocogen/0b1c843eaa167caf590bd56f46f5a57f6ffc6000/chocogen.php -o chocogen.php
      - run: php chocogen.php 0.6.0 # Bump me before making a new release!
      - name: Upload Sun
        uses: actions/upload-artifact@v7
        with:
          name: "Windows (X64) Chocolatey Package"
          path: ./*.nupkg
