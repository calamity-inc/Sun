name: Build

on: push

jobs:
  ubuntu-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Build Soup
        run: php Sun/vendor/Soup/build_lib.php

      - name: Build Sun
        run: clang -O3 -o Sun/sun Sun/sun.cpp -ISun/vendor/Soup Sun/vendor/Soup/libsoup.a -std=c++17 -fuse-ld=lld -lstdc++ -lstdc++fs -pthreads

      - name: Upload Sun
        uses: actions/upload-artifact@v7
        with:
          name: "Linux (X64)"
          path: Sun/sun

      - run: php scripts/test.php

      - run: php scripts/bundle_deb.php

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: "Linux (X64) - .deb"
          path: sun.*.deb

  ubuntu-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build Soup
        run: php Sun/vendor/Soup/build_lib.php

      - name: Build Sun
        run: clang -O3 -o Sun/sun Sun/sun.cpp -ISun/vendor/Soup Sun/vendor/Soup/libsoup.a -std=c++17 -fuse-ld=lld -lstdc++ -lstdc++fs -pthreads

      - name: Upload Sun
        uses: actions/upload-artifact@v7
        with:
          name: "Linux (ARM64)"
          path: Sun/sun

      - run: php scripts/test.php

      - run: php scripts/bundle_deb.php

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: "Linux (ARM64) - .deb"
          path: sun.*.deb


  macos-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - name: Build Soup
        run: php Sun/vendor/Soup/build_lib.php

      - name: Build Sun
        run: clang -O3 -o Sun/sun Sun/sun.cpp -ISun/vendor/Soup Sun/vendor/Soup/libsoup.a -std=c++17 -lc++

      - name: Upload Sun
        uses: actions/upload-artifact@v7
        with:
          name: "MacOS (X64)"
          path: Sun/sun

      - run: php scripts/test.php

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Build Soup
        run: php Sun/vendor/Soup/build_lib.php

      - name: Build Sun
        run: clang -O3 -o Sun/sun Sun/sun.cpp -ISun/vendor/Soup Sun/vendor/Soup/libsoup.a -std=c++17 -lc++

      - name: Upload Sun
        uses: actions/upload-artifact@v7
        with:
          name: "MacOS (ARM64)"
          path: Sun/sun

      - run: php scripts/test.php

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Soup
        run: php Sun/vendor/Soup/build_lib.php

      - name: Build Sun
        run: clang -O3 -o Sun.exe Sun/sun.cpp -ISun/vendor/Soup Sun/vendor/Soup/soup.lib -std=c++17

      - name: Upload Sun
        uses: actions/upload-artifact@v7
        with:
          name: "Windows (X64)"
          path: Sun.exe

      - run: php scripts/test.php

      - run: php scripts/bundle_nupkg.php

      - name: Upload Chocolatey Package
        uses: actions/upload-artifact@v7
        with:
          name: "Windows (X64) Chocolatey Package"
          path: ./*.nupkg

  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build Soup
        run: php Sun/vendor/Soup/build_lib.php

      - name: Build Sun
        run: clang -O3 -o Sun.exe Sun/sun.cpp -ISun/vendor/Soup Sun/vendor/Soup/soup.lib -std=c++17

      - name: Upload Sun
        uses: actions/upload-artifact@v7
        with:
          name: "Windows (ARM64)"
          path: Sun.exe

      - run: php scripts/test.php
